plugins { id "com.android.application" }

android {
    namespace "online.realsports.app"
    compileSdk 34
    defaultConfig {
        applicationId "online.realsports.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [hostName: "realsports.online", defaultUrl: "https://realsports.online/index.html"]
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("RS_KEYSTORE") ?: "release.jks")
            storePassword System.getenv("RS_KEYSTORE_PASS")
            keyAlias "realsports"
            keyPassword System.getenv("RS_KEYSTORE_PASS")
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0" }
