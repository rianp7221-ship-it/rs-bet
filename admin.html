<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — REAL SPORTS</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth-style.css">
  <link rel="stylesheet" href="header-fix.css">
</head>
<body>
  <header id="rs-header"></header>
  <main class="container" id="admin" hidden>
    <div class="stats" id="stats"></div>

    <nav class="tabs inline" data-tabs>
      <button data-tab="a-matches" class="active">Jogos</button>
      <button data-tab="a-tx">Depósitos e saques</button>
      <button data-tab="a-users">Usuários</button>
      <button data-tab="a-bets">Bilhetes</button>
    </nav>

    <section id="a-matches" class="tab-panel">
      <form id="match-form" class="form-grid card">
        <input name="sport" class="input" placeholder="Esporte" value="Futebol" required>
        <input name="league" class="input" placeholder="Campeonato" required>
        <input name="home" class="input" placeholder="Time da casa" required>
        <input name="away" class="input" placeholder="Visitante" required>
        <input name="starts_at" type="datetime-local" class="input" required>
        <input name="odd_home" type="number" step="0.01" min="1.01" class="input" placeholder="Odd casa" required>
        <input name="odd_draw" type="number" step="0.01" min="1.01" class="input" placeholder="Odd empate (opcional)">
        <input name="odd_away" type="number" step="0.01" min="1.01" class="input" placeholder="Odd fora" required>
        <button class="btn btn-primary">Adicionar jogo</button>
      </form>
      <div id="m-list"></div>
    </section>
    <section id="a-tx" class="tab-panel hidden"><div id="tx-list"></div></section>
    <section id="a-users" class="tab-panel hidden">
      <input id="u-search" class="input" placeholder="Buscar por email ou usuário">
      <div id="u-list"></div>
    </section>
    <section id="a-bets" class="tab-panel hidden"><div id="b-list"></div></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="rs-base.js"></script>
  <script src="auth-header.js"></script>
  <script>
  (async () => {
    await RS.requireLogin();
    const me = await RS.profile();
    // a proteção real está no banco (is_admin); isto só esconde a tela
    if (!me?.is_admin) { location.href = "index.html"; return; }
    RS.$("#admin").hidden = false;
    const STATUS = { open: "Aberto", live: "Ao vivo", closed: "Fechado", settled: "Liquidado", canceled: "Cancelado", pending: "Pendente", won: "Ganhou", lost: "Perdeu", done: "Concluída", rejected: "Recusada" };
    const badge = (s) => `<span class="badge b-${s}">${STATUS[s] || s}</span>`;
    const act = async (fn, args, msg) => { try { await RS.rpc(fn, args); RS.toast(msg, "ok"); all(); } catch (e) { RS.toast(e.message, "error"); } };

    async function stats() {
      const [{ count: users }, { data: bets }, { count: pend }] = await Promise.all([
        sb.from("profiles").select("*", { count: "exact", head: true }),
        sb.from("bets").select("stake,potential,status"),
        sb.from("transactions").select("*", { count: "exact", head: true }).eq("status", "pending"),
      ]);
      const vol = bets.reduce((a, b) => a + Number(b.stake), 0);
      const paid = bets.filter((b) => b.status === "won").reduce((a, b) => a + Number(b.potential), 0);
      RS.$("#stats").innerHTML = [["Usuários", users], ["Volume apostado", RS.money(vol)], ["Prêmios pagos", RS.money(paid)],
        ["Lucro esportes", RS.money(vol - paid)], ["Pendências", pend]].map(([l, v]) => `<div class="stat"><small>${l}</small><b>${v}</b></div>`).join("");
    }

    async function matches() {
      const { data } = await sb.from("matches").select("*").order("starts_at", { ascending: false }).limit(100);
      RS.$("#m-list").innerHTML = `<table class="table"><thead><tr><th>Jogo</th><th>Data</th><th>Odds</th><th>Status</th><th>Ações</th></tr></thead><tbody>
      ${data.map((m) => `<tr><td><small>${RS.esc(m.league)}</small><br>${RS.esc(m.home)} x ${RS.esc(m.away)}</td><td>${RS.date(m.starts_at)}</td>
        <td>${m.odd_home} / ${m.odd_draw ?? "-"} / ${m.odd_away}</td><td>${badge(m.status)}${m.result ? " " + m.result : ""}</td>
        <td class="actions">${m.status === "settled" ? "" : `
          <button class="btn sm" data-st="${m.id}" data-v="${m.status === "live" ? "open" : "live"}">${m.status === "live" ? "Tirar do ao vivo" : "Ao vivo"}</button>
          <button class="btn sm" data-res="${m.id}" data-r="home">Venceu casa</button>
          ${m.odd_draw ? `<button class="btn sm" data-res="${m.id}" data-r="draw">Empate</button>` : ""}
          <button class="btn sm" data-res="${m.id}" data-r="away">Venceu fora</button>`}
          <button class="btn sm danger" data-del="${m.id}">Excluir</button></td></tr>`).join("")}</tbody></table>`;
    }
    RS.$("#m-list").addEventListener("click", async (e) => {
      const b = e.target;
      if (b.dataset.res && confirm("Confirmar resultado? Os bilhetes serão pagos agora.")) act("settle_match", { p_match: +b.dataset.res, p_result: b.dataset.r }, "Jogo liquidado");
      if (b.dataset.st) { await sb.from("matches").update({ status: b.dataset.v }).eq("id", b.dataset.st); all(); }
      if (b.dataset.del && confirm("Excluir jogo?")) {
        const { error } = await sb.from("matches").delete().eq("id", b.dataset.del);
        RS.toast(error ? "Jogo tem apostas — não pode ser excluído" : "Excluído", error ? "error" : "ok"); all();
      }
    });
    RS.$("#match-form").onsubmit = async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      f.starts_at = new Date(f.starts_at).toISOString();
      if (!f.odd_draw) f.odd_draw = null;
      const { error } = await sb.from("matches").insert(f);
      RS.toast(error ? RS.err(error) : "Jogo adicionado", error ? "error" : "ok");
      if (!error) { e.target.reset(); all(); }
    };

    async function txs() {
      const { data } = await sb.from("transactions").select("*, profiles(email)").in("type", ["deposit", "withdraw"])
        .order("created_at", { ascending: false }).limit(100);
      RS.$("#tx-list").innerHTML = `<table class="table"><thead><tr><th>#</th><th>Usuário</th><th>Tipo</th><th>Valor</th><th>Data</th><th>Status</th><th></th></tr></thead><tbody>
      ${data.map((t) => `<tr><td>${t.id}</td><td>${RS.esc(t.profiles?.email)}</td><td>${t.type === "deposit" ? "Depósito" : "Saque"}</td>
        <td>${RS.money(Math.abs(t.amount))}</td><td>${RS.date(t.created_at)}</td><td>${badge(t.status)}</td>
        <td class="actions">${t.status === "pending" ? `<button class="btn sm" data-ok="${t.id}">Aprovar</button><button class="btn sm danger" data-no="${t.id}">Recusar</button>` : ""}</td></tr>`).join("")}</tbody></table>`;
    }
    RS.$("#tx-list").addEventListener("click", (e) => {
      if (e.target.dataset.ok) act("admin_review_transaction", { p_tx: +e.target.dataset.ok, p_approve: true }, "Aprovado");
      if (e.target.dataset.no) act("admin_review_transaction", { p_tx: +e.target.dataset.no, p_approve: false }, "Recusado");
    });

    async function users() {
      const q = RS.$("#u-search").value.trim();
      let req = sb.from("profiles").select("*").order("created_at", { ascending: false }).limit(100);
      if (q) req = req.or(`email.ilike.%${q}%,username.ilike.%${q}%`);
      const { data } = await req;
      RS.$("#u-list").innerHTML = `<table class="table"><thead><tr><th>Usuário</th><th>Saldo</th><th>Desde</th><th></th></tr></thead><tbody>
      ${data.map((u) => `<tr><td>${RS.esc(u.username)}<br><small>${RS.esc(u.email)}</small> ${u.is_admin ? '<span class="badge b-won">admin</span>' : ""} ${u.blocked ? '<span class="badge b-lost">bloqueado</span>' : ""}</td>
        <td>${RS.money(u.balance)}</td><td>${RS.date(u.created_at)}</td>
        <td class="actions"><button class="btn sm" data-adj="${u.id}">Ajustar saldo</button>
        <button class="btn sm ${u.blocked ? "" : "danger"}" data-blk="${u.id}" data-v="${!u.blocked}">${u.blocked ? "Desbloquear" : "Bloquear"}</button></td></tr>`).join("")}</tbody></table>`;
    }
    RS.$("#u-search").oninput = users;
    RS.$("#u-list").addEventListener("click", (e) => {
      const b = e.target;
      if (b.dataset.adj) {
        const v = Number(prompt("Valor (use negativo para retirar):"));
        if (v) act("admin_adjust_balance", { p_user: b.dataset.adj, p_amount: v, p_reason: prompt("Motivo:") || "Ajuste manual" }, "Saldo ajustado");
      }
      if (b.dataset.blk) act("admin_set_blocked", { p_user: b.dataset.blk, p_blocked: b.dataset.v === "true" }, "Atualizado");
    });

    async function bets() {
      const { data } = await sb.from("bets").select("*, profiles(email), bet_selections(count)").order("created_at", { ascending: false }).limit(100);
      RS.$("#b-list").innerHTML = `<table class="table"><thead><tr><th>#</th><th>Usuário</th><th>Jogos</th><th>Aposta</th><th>Odd</th><th>Retorno</th><th>Status</th></tr></thead><tbody>
      ${data.map((b) => `<tr><td>${b.id}</td><td>${RS.esc(b.profiles?.email)}</td><td>${b.bet_selections[0]?.count}</td><td>${RS.money(b.stake)}</td>
        <td>${b.total_odd}</td><td>${RS.money(b.potential)}</td><td>${badge(b.status)}</td></tr>`).join("")}</tbody></table>`;
    }

    function all() { stats(); matches(); txs(); users(); bets(); }
    all();
  })();
  </script>
</body>
</html>
